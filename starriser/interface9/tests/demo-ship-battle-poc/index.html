<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxy · Directed battle lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#010510;color:#d9e7f2;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:20px;left:25px;pointer-events:none}h1{margin:0;font-size:23px;font-weight:550}p{color:#89a8bc;margin:7px 0}.panel{position:absolute;bottom:20px;left:20px;right:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;background:#071323eb;border:1px solid #28465a;border-radius:12px}button,select,input[type=number]{background:#15283b;color:#e2f5ff;border:1px solid #39566e;border-radius:6px;padding:8px}label{display:flex;gap:5px;align-items:center}input[type=number]{width:60px}#error{position:absolute;top:100px;left:25px;color:#ffa896;white-space:pre-wrap}#status{width:100%;color:#85bed9}aside{position:absolute;top:20px;right:25px;text-align:right;color:#7692a5;font-size:12px}
</style></head><body><canvas></canvas><header><h1>DIRECTED BATTLE LAB</h1><p>Free flight · join both fleets · drag to orbit, scroll to zoom</p></header><aside>Mock backend reports · 20 ship types per fleet<br>30-second planet orbit · no damage or battle detection</aside><div id="error"></div><div class="panel">
<select id="count" aria-label="Agent count"><option>1000</option><option>10000</option></select><button id="restart">Restart</button><button id="pause">Pause</button>
<label>Fleet <select id="fleet"><option value="0">Blue</option><option value="1">Orange</option></select></label>
<button id="join">Join battle</button><button id="leave">Leave battle</button>
<select id="strategy" aria-label="Directed strategy"><option value="pass">Attack passes</option><option value="pursue">Pursue</option><option value="hold">Hold</option><option value="withdraw">Withdraw</option></select>
<label>Type <input id="type" type="number" value="0" min="0" max="19"></label><button id="attack">Attack type</button>
<button id="loss">Report 20% losses</button><button id="destroy">Report all lost</button>
<label><input id="planets" type="checkbox" checked>Planets</label><label><input id="density" type="checkbox" checked>Density</label><label><input id="merged" type="checkbox">Shared pressure</label><label><input id="follow" type="checkbox">Follow ship</label><div id="status">Starting WebGPU…</div></div><script type="module" src="./main.mjs"></script></body></html>
